services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    volumes:
      - ${HOME}/.hermes:/opt/data
      - ./hermes_cli/web_server.py:/opt/hermes/hermes_cli/web_server.py:ro
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_DASHBOARD=true
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_INSECURE=true
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=127.0.0.1
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${API_SERVER_KEY:-local-dashboard-health}
      - GATEWAY_HEALTH_URL=http://127.0.0.1:8642
    ports:
      - "127.0.0.1:9119:9119"
    command: ["gateway", "run"]
