# Build the deployment image on CI instead of on the laptop that runs it.
#
# Building locally costs ~15 GB of peak disk on a machine that has repeatedly
# run out — a full disk here has already taken Docker down and, with it, the
# agent. The image is the same either way, so it may as well be built somewhere
# with disk to spare and pulled as a ~1 GB download.
#
# arm64 only, natively: this deployment runs on Apple Silicon, and
# ubuntu-24.04-arm is a free runner for public repos — no QEMU emulation, which
# would make a Python+Node image take the better part of an hour.
#
# Publishes to GHCR under this fork, not the upstream Docker Hub repo, which
# this account cannot push to.
name: Fork image (arm64 → GHCR)

on:
  workflow_dispatch:
  push:
    branches: [feat/cost-cascade-router]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/fork-image.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # `latest` is what the deployment pulls; the SHA tag makes it possible
          # to pin or roll back to a known build.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Registry-backed cache: the runner is ephemeral, so without this every
          # build reinstalls the whole Python/Node toolchain from scratch.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false

      - name: Report
        run: |
          echo "### Образ собран" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ env.IMAGE }}
